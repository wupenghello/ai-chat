# ai-chat 本地编排（CHG-004 部署条款：本地一键起，不锁死云环境）
# iter-9 T3：全链路（前端 nginx 托管 dist/ + 反代 /api + backend + SQLite 数据卷）
services:
  backend:
    build: ./backend
    container_name: ai-chat-backend
    ports:
      - "8000:8000"
    environment:
      AI_CHAT_DB_PATH: /data/ai-chat.db
    # 统一 key 三变量（design-iter-7 定夺①）：.env 不入 git，容器经 env_file 注入；
    # required: false——未配置也能起服务（对话返回 503 引导文案，见代理端点）
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    # 前端构建产物（dist/ 由 `npm run build` 产出）经 nginx:alpine 托管 + /api 反代 backend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-chat-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 经 nginx 反代打 backend /api/health：同时验证静态托管与 /api 代理全链路。
      # 用 127.0.0.1 而非 localhost——busybox wget 会把 localhost 解析为 ::1，而 nginx 仅监听 IPv4 :80
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
