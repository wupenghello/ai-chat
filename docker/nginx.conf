# ai-chat 前端静态托管 + /api 反代 backend（全链路 Compose，iter-9 T3）
# 与本地 Vite dev proxy 同构：/api 同源转发，HttpOnly Cookie 依赖同源、无 CORS
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由（createWebHistory）：刷新 /admin 等深层路由回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* → backend:8000（proxy_pass 无 URI，原样透传完整路径）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式：关闭缓冲，长连接不超时（上游 read 最长 120s）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }
}
